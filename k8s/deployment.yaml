apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-deployment
  labels:
    app: webapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      serviceAccountName: webapp-service-account
      containers:
      - name: gcloud-webapp
        image: $IMAGE
        ports:
        - containerPort: 8080
        env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-webapp-secret 
              key: username
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: db-webapp-secret
              key: password
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: db-webapp-secret
              key: database
      - name: cloud-sql-proxy
        image: gcr.io/cloudsql-docker/gce-proxy:1.17
        command:
          - "/cloud_sql_proxy"
          - "-ip_address_types=PRIVATE"
          - "-instances=${INSTANCE_CONNECTION_NAME}=tcp:5432"
        securityContext:
          runAsNonRoot: true